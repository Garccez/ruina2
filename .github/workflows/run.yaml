name: Ruina

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  ruina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnóstico de rede
        run: |
          getent ahosts portal.ufsm.br
          curl -4 -sv -m 15 -o /dev/null https://portal.ufsm.br/ || true
          curl -6 -sv -m 15 -o /dev/null https://portal.ufsm.br/ || true
      - name: Agendar refeições
        env:
          RUINA_USERNAME: ${{ secrets.Username }}
          RUINA_PASSWORD: ${{ secrets.Password }}
        run: python main.py
